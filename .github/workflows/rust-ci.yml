name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Format, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libgbm-dev \
            libinput-dev \
            libseat-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --all-targets
      - run: cargo test --locked --all-targets -- --test-threads=1
